name: Issue assignment timeout

on:
  schedule:
    # Run once every day
    - cron: "0 9 * * *"

  # Allows manual testing from the Actions tab
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-assignments:
    runs-on: ubuntu-latest

    steps:
      - name: Remove expired issue assignments
        uses: actions/github-script@v8
        env:
          ORG_MEMBERSHIP_TOKEN: ${{ secrets.ORG_MEMBERSHIP_TOKEN }}
        with:
          script: |
            const MAX_DAYS = 14;
            const EXEMPT_USERS = new Set([
              "0xaboomar",
              "aaronbrethorst",
              "ahmedhossamdev",
              "amrhossamdev"
            ]);
            const membershipToken = process.env.ORG_MEMBERSHIP_TOKEN;

            if (!membershipToken) {
              throw new Error(
                "Set the ORG_MEMBERSHIP_TOKEN repository secret to check OneBusAway membership."
              );
            }

            const { getOctokit } = require("@actions/github");
            const orgGithub = getOctokit(membershipToken);
            const membershipCache = new Map();

            async function isOneBusAwayMember(username) {
              const normalizedUsername = username.toLowerCase();
              if (membershipCache.has(normalizedUsername)) {
                return membershipCache.get(normalizedUsername);
              }

              try {
                await orgGithub.rest.orgs.checkMembershipForUser({
                  org: "OneBusAway",
                  username
                });
                membershipCache.set(normalizedUsername, true);
                return true;
              } catch (error) {
                if (error.status === 404) {
                  membershipCache.set(normalizedUsername, false);
                  return false;
                }
                throw error;
              }
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100
              }
            );

            for (const issue of issues) {
              // Skip pull requests
              if (issue.pull_request) continue;

              if (!issue.assignees?.length) continue;

              const assigneesToCheck = [];
              for (const assignee of issue.assignees) {
                const login = assignee.login.toLowerCase();
                if (EXEMPT_USERS.has(login)) continue;
                if (await isOneBusAwayMember(assignee.login)) continue;
                assigneesToCheck.push(assignee);
              }
              if (assigneesToCheck.length === 0) continue;

              const events = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  per_page: 100
                }
              );

              const expiredAssignees = [];

              for (const assignee of assigneesToCheck) {
                // Find the latest assignment event for this user
                const assignment = events
                  .filter(
                    event =>
                      event.event === "assigned" &&
                      event.assignee?.login === assignee.login
                  )
                  .sort(
                    (a, b) =>
                      new Date(b.created_at) - new Date(a.created_at)
                  )[0];

                if (!assignment) continue;

                const assignedAt = new Date(assignment.created_at);
                const age =
                  (Date.now() - assignedAt.getTime()) /
                  (1000 * 60 * 60 * 24);

                if (age < MAX_DAYS) continue;

                expiredAssignees.push(assignee.login);
              }

              if (expiredAssignees.length === 0) continue;

              await github.rest.issues.removeAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: expiredAssignees
              });

              const mentions = expiredAssignees.map(login => `@${login}`);
              const comment =
                expiredAssignees.length === 1
                  ? `${mentions[0]} has been automatically unassigned because this project limits issue assignments to ${MAX_DAYS} days.

            If you need more time, please mention a maintainer and ask to be assigned again.

            If anyone else would like to work on this issue, please mention a maintainer to request assignment.`
                  : `${mentions.join(", ")} have been automatically unassigned because this project limits issue assignments to ${MAX_DAYS} days.

            If you need more time, please mention a maintainer and ask to be assigned again.

            If anyone else would like to work on this issue, please mention a maintainer to request assignment.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment
              });
            }
