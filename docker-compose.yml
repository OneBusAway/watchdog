services:
  watchdog:
    build:
      context: .
    container_name: watchdog
    environment:
      CONFIG_AUTH_USER: admin
      CONFIG_AUTH_PASS: password
      # Optional investigation store. Remove this line to run without PostgreSQL.
      DATABASE_URL: postgres://watchdog:watchdog@postgres:5432/watchdog?sslmode=disable
    command: ["--config-file", "/app/config.json", "--port", "4000"]
    volumes:
      - ./config.json:/app/config.json:ro
    ports:
      - "4000:4000"
    networks:
      - observability
    depends_on:
      postgres:
        # Watchdog connects once at startup and runs without the database if
        # it is not ready, so wait for it to accept connections.
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: watchdog
      POSTGRES_PASSWORD: watchdog
      POSTGRES_DB: watchdog
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdog -d watchdog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
    ports:
      - "9090:9090"
    networks:
      - observability
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - observability

networks:
  observability:

volumes:
  postgres-data:
