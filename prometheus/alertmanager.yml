route:
  receiver: "webhook"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "webhook"
    webhook_configs:
      # Placeholder receiver. Nothing in this repository serves this URL, and
      # host.internal is not resolvable by default from inside a container,
      # so every notification sent here fails to deliver. Replace it with a
      # real receiver (your own webhook, Slack, PagerDuty, email, ...) before
      # relying on these alerts.
      #
      # To reach a receiver running on the Docker host, use
      # host.docker.internal. Docker Desktop resolves it out of the box; with
      # Docker Engine on Linux, also add this to the alertmanager service in
      # docker-compose.yml:
      #   extra_hosts:
      #     - "host.docker.internal:host-gateway"
      - url: "http://host.internal/alerts"
        send_resolved: true
