rule_files:
evaluation_interval: 1m
tests:
  # -------------------------------------------------------------------------
  # Scenario 1: Fresh success shows the value
  # -------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'realtime_vehicle_positions_count_gtfs_rt{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1"}'
        values: '10'
      - series: 'gtfs_static_bundle_usable{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1"}'
        values: '1+0x60'
      - series: 'oba_agency_active_vehicles_count{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1"}'
        values: '12'
      - series: 'gtfs_rt_tracked_vehicles_count{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1"}'
        values: '8'
      - series: 'gtfs_rt_vehicle_computed_speed{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1",feed="0",vehicle_id="v1"}'
        values: '45.5'
      - series: 'gtfs_rt_vehicle_speed_discrepancy_ratio{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1",feed="0",vehicle_id="v1"}'
        values: '0.12'
      - series: 'gtfs_rt_feed_fetch_success{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1",feed="0",feed_url="http://f1"}'
        values: '1'
      - series: 'gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1",feed="0",feed_url="http://f1"}'
        values: '100'
      - series: 'oba_vehicles_last_successful_fetch_timestamp_seconds{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1"}'
        values: '100'
      - series: 'watchdog_collection_interval_seconds'
        values: '30'
      - series: 'watchdog_collection_last_completed_timestamp_seconds'
        values: '100'
    promql_expr_test:
      - expr: '(((realtime_vehicle_positions_count_gtfs_rt{agency_id=~".*",agency_id!="",server_url=~".*"} and on (agency_id, agency_name, server_name, server_url) ((min by (agency_id, agency_name, server_name, server_url) (gtfs_rt_feed_fetch_success{agency_id!=""}) == 1) and ((time() - min by (agency_id, agency_name, server_name, server_url) (gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id!=""})) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300)))) or (realtime_vehicle_positions_count_gtfs_rt{agency_id=~".*",server_url=~".*"} unless on (agency_id, server_name, server_url) gtfs_rt_feed_fetch_success{agency_id!=""} and on (server_name, server_url) ((min by (server_name, server_url) (gtfs_rt_feed_fetch_success{agency_id=""}) == 1) and ((time() - min by (server_name, server_url) (gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id=""})) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))))) and on (agency_id, agency_name, server_name, server_url) (gtfs_static_bundle_usable == 1)) and on() ((time() - watchdog_collection_last_completed_timestamp_seconds) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))'
        eval_time: 110s
        exp_samples:
          - labels: 'realtime_vehicle_positions_count_gtfs_rt{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1"}'
            value: 10
      - expr: '(oba_agency_active_vehicles_count{agency_id=~".*",server_url=~".*"} and on (agency_id, agency_name, server_name, server_url) ((time() - oba_vehicles_last_successful_fetch_timestamp_seconds{agency_id=~".*",server_url=~".*"}) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))) and on() ((time() - watchdog_collection_last_completed_timestamp_seconds) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))'
        eval_time: 110s
        exp_samples:
          - labels: 'oba_agency_active_vehicles_count{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1"}'
            value: 12
      - expr: '(((gtfs_rt_tracked_vehicles_count{agency_id=~".*",agency_id!="",server_url=~".*"} and on (agency_id, agency_name, server_name, server_url) ((min by (agency_id, agency_name, server_name, server_url) (gtfs_rt_feed_fetch_success{agency_id!=""}) == 1) and ((time() - min by (agency_id, agency_name, server_name, server_url) (gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id!=""})) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300)))) or (gtfs_rt_tracked_vehicles_count{agency_id=~".*",server_url=~".*"} unless on (agency_id, server_name, server_url) gtfs_rt_feed_fetch_success{agency_id!=""} and on (server_name, server_url) ((min by (server_name, server_url) (gtfs_rt_feed_fetch_success{agency_id=""}) == 1) and ((time() - min by (server_name, server_url) (gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id=""})) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))))) and on (agency_id, agency_name, server_name, server_url) (gtfs_static_bundle_usable == 1)) and on() ((time() - watchdog_collection_last_completed_timestamp_seconds) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))'
        eval_time: 110s
        exp_samples:
          - labels: 'gtfs_rt_tracked_vehicles_count{agency_id="agency1",agency_name="Agency 1",server_name="s1",server_url="http://s1"}'
            value: 8
      - expr: '(((gtfs_rt_vehicle_computed_speed{agency_id=~".*",agency_id!="",server_url=~".*"} and on (agency_id, agency_name, server_name, server_url, feed) (gtfs_rt_feed_fetch_success{agency_id!=""} == 1) and on (agency_id, agency_name, server_name, server_url, feed) ((time() - gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id!=""}) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))) or (gtfs_rt_vehicle_computed_speed{agency_id=~".*",server_url=~".*"} unless on (agency_id, server_name, server_url) gtfs_rt_feed_fetch_success{agency_id!=""} and on (server_name, server_url, feed) (gtfs_rt_feed_fetch_success{agency_id=""} == 1) and on (server_name, server_url, feed) ((time() - gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id=""}) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300)))) and on (agency_id, agency_name, server_name, server_url) (gtfs_static_bundle_usable == 1)) and on() ((time() - watchdog_collection_last_completed_timestamp_seconds) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))'
        eval_time: 110s
        exp_samples:
