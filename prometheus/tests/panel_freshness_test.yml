            value: 45.5
      - expr: '(((gtfs_rt_vehicle_speed_discrepancy_ratio{agency_id=~".*",agency_id!="",server_url=~".*"} and on (agency_id, agency_name, server_name, server_url, feed) (gtfs_rt_feed_fetch_success{agency_id!=""} == 1) and on (agency_id, agency_name, server_name, server_url, feed) ((time() - gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id!=""}) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))) or (gtfs_rt_vehicle_speed_discrepancy_ratio{agency_id=~".*",server_url=~".*"} unless on (agency_id, server_name, server_url) gtfs_rt_feed_fetch_success{agency_id!=""} and on (server_name, server_url, feed) (gtfs_rt_feed_fetch_success{agency_id=""} == 1) and on (server_name, server_url, feed) ((time() - gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id=""}) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300)))) and on (agency_id, agency_name, server_name, server_url) (gtfs_static_bundle_usable == 1)) and on() ((time() - watchdog_collection_last_completed_timestamp_seconds) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))'
