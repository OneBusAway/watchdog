  # -------------------------------------------------------------------------
  # Scenario 8: Fresh zero during scheduled service, unattributed counts,
  # and speed age. The zero and speed queries cover both feed scopes.
  # Feed failure, feed staleness, and a stale collection heartbeat each hide
  # these values independently.
  # -------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'gtfs_rt_feed_fetch_success{agency_id="",agency_name="Server Scope",feed="0",feed_url="http://f0",server_name="s1",server_url="http://s1"}'
        values: '1 1 0 1 1'
      - series: 'gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id="",agency_name="Server Scope",feed="0",feed_url="http://f0",server_name="s1",server_url="http://s1"}'
        values: '0 60 60 60 240'
      - series: 'watchdog_collection_interval_seconds'
        values: '30'
      - series: 'watchdog_collection_last_completed_timestamp_seconds'
        values: '0 60 120 120 120'
      - series: 'gtfs_schedule_available{agency_id="A",agency_name="Agency A",server_name="s1",server_url="http://s1"}'
        values: '1'
      - series: 'gtfs_scheduled_service_active{agency_id="A",agency_name="Agency A",server_name="s1",server_url="http://s1"}'
        values: '1'
      - series: 'gtfs_static_bundle_usable{agency_id="A",agency_name="Agency A",server_name="s1",server_url="http://s1"}'
        values: '1'
      - series: 'realtime_vehicle_positions_count_gtfs_rt{agency_id="A",agency_name="Agency A",server_name="s1",server_url="http://s1"}'
        values: '0'
      - series: 'gtfs_rt_unattributed_vehicles_count{server_name="s1",server_url="http://s1"}'
        values: '3'
      - series: 'gtfs_rt_unattributed_vehicles_by_reason_count{reason="unknown_route_id",server_name="s1",server_url="http://s1"}'
        values: '2'
      - series: 'gtfs_rt_unattributed_vehicle_potential_agency_associations_count{agency_id="A",agency_name="Agency A",server_name="s1",server_url="http://s1"}'
        values: '1'
      - series: 'gtfs_rt_vehicle_speed_last_computed_timestamp_seconds{agency_id="A",agency_name="Agency A",feed="0",vehicle_id="va1",server_name="s1",server_url="http://s1"}'
        values: '50'
      # A different server supplies agency-scoped feed health only.
      - series: 'gtfs_rt_feed_fetch_success{agency_id="B",agency_name="Agency B",feed="0",feed_url="http://f1",server_name="s2",server_url="http://s2"}'
        values: '1 1 0 1 1'
      - series: 'gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id="B",agency_name="Agency B",feed="0",feed_url="http://f1",server_name="s2",server_url="http://s2"}'
        values: '0 60 60 60 240'
      - series: 'gtfs_schedule_available{agency_id="B",agency_name="Agency B",server_name="s2",server_url="http://s2"}'
        values: '1'
      - series: 'gtfs_scheduled_service_active{agency_id="B",agency_name="Agency B",server_name="s2",server_url="http://s2"}'
        values: '1'
      - series: 'gtfs_static_bundle_usable{agency_id="B",agency_name="Agency B",server_name="s2",server_url="http://s2"}'
        values: '1'
      - series: 'realtime_vehicle_positions_count_gtfs_rt{agency_id="B",agency_name="Agency B",server_name="s2",server_url="http://s2"}'
        values: '0'
      - series: 'gtfs_rt_vehicle_speed_last_computed_timestamp_seconds{agency_id="B",agency_name="Agency B",feed="0",vehicle_id="vb1",server_name="s2",server_url="http://s2"}'
        values: '40'
    promql_expr_test:
      # 60s: the feed and collection are both fresh.
      - expr: &unexpected_zero '(((realtime_vehicle_positions_count_gtfs_rt{agency_id=~".*",server_url=~".*"} == 0) and on (agency_id, agency_name, server_name, server_url) (gtfs_schedule_available == 1) and on (agency_id, agency_name, server_name, server_url) (gtfs_scheduled_service_active == 1) and on (agency_id, agency_name, server_name, server_url) (gtfs_static_bundle_usable == 1) and on (agency_id, server_name, server_url) (min by (agency_id, server_name, server_url) (gtfs_rt_feed_fetch_success{agency_id!=""}) == 1) and on (agency_id, server_name, server_url) ((time() - min by (agency_id, server_name, server_url) (gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id!=""})) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))) or ((realtime_vehicle_positions_count_gtfs_rt{agency_id=~".*",server_url=~".*"} == 0) and on (agency_id, agency_name, server_name, server_url) (gtfs_schedule_available == 1) and on (agency_id, agency_name, server_name, server_url) (gtfs_scheduled_service_active == 1) and on (agency_id, agency_name, server_name, server_url) (gtfs_static_bundle_usable == 1) and on (server_name, server_url) (min by (server_name, server_url) (gtfs_rt_feed_fetch_success{agency_id=""}) == 1) and on (server_name, server_url) ((time() - min by (server_name, server_url) (gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id=""})) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300)))) and on() ((time() - watchdog_collection_last_completed_timestamp_seconds) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))'
        eval_time: 60s
        exp_samples:
          - labels: 'realtime_vehicle_positions_count_gtfs_rt{agency_id="A",agency_name="Agency A",server_name="s1",server_url="http://s1"}'
            value: 0
          - labels: 'realtime_vehicle_positions_count_gtfs_rt{agency_id="B",agency_name="Agency B",server_name="s2",server_url="http://s2"}'
            value: 0
      - expr: &unattributed 'gtfs_rt_unattributed_vehicles_count{server_url=~".*"} and on (server_name, server_url) (min by (server_name, server_url) (gtfs_rt_feed_fetch_success{agency_id=""}) == 1) and on (server_name, server_url) ((time() - min by (server_name, server_url) (gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id=""})) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300)) and on() ((time() - watchdog_collection_last_completed_timestamp_seconds) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))'
        eval_time: 60s
        exp_samples:
          - labels: 'gtfs_rt_unattributed_vehicles_count{server_name="s1",server_url="http://s1"}'
            value: 3
      - expr: &unattributed_reason 'gtfs_rt_unattributed_vehicles_by_reason_count{server_url=~".*"} and on (server_name, server_url) (min by (server_name, server_url) (gtfs_rt_feed_fetch_success{agency_id=""}) == 1) and on (server_name, server_url) ((time() - min by (server_name, server_url) (gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id=""})) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300)) and on() ((time() - watchdog_collection_last_completed_timestamp_seconds) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))'
        eval_time: 60s
        exp_samples:
          - labels: 'gtfs_rt_unattributed_vehicles_by_reason_count{reason="unknown_route_id",server_name="s1",server_url="http://s1"}'
            value: 2
      - expr: &potential_agency 'gtfs_rt_unattributed_vehicle_potential_agency_associations_count{agency_id=~".*",server_url=~".*"} and on (agency_id, agency_name, server_name, server_url) (gtfs_static_bundle_usable == 1) and on (server_name, server_url) (min by (server_name, server_url) (gtfs_rt_feed_fetch_success{agency_id=""}) == 1) and on (server_name, server_url) ((time() - min by (server_name, server_url) (gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id=""})) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300)) and on() ((time() - watchdog_collection_last_completed_timestamp_seconds) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))'
        eval_time: 60s
        exp_samples:
          - labels: 'gtfs_rt_unattributed_vehicle_potential_agency_associations_count{agency_id="A",agency_name="Agency A",server_name="s1",server_url="http://s1"}'
            value: 1
      - expr: &speed_age '((((time() - gtfs_rt_vehicle_speed_last_computed_timestamp_seconds{agency_id=~".*",server_url=~".*"}) and on (agency_id, server_name, server_url, feed) (gtfs_rt_feed_fetch_success{agency_id!=""} == 1) and on (agency_id, server_name, server_url, feed) ((time() - gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id!=""}) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300)))) or (((time() - gtfs_rt_vehicle_speed_last_computed_timestamp_seconds{agency_id=~".*",server_url=~".*"}) and on (server_name, server_url, feed) (gtfs_rt_feed_fetch_success{agency_id=""} == 1) and on (server_name, server_url, feed) ((time() - gtfs_rt_feed_last_successful_fetch_timestamp_seconds{agency_id=""}) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))))) and on (agency_id, agency_name, server_name, server_url) (gtfs_static_bundle_usable == 1) and on() ((time() - watchdog_collection_last_completed_timestamp_seconds) < on() group_left clamp_max(clamp_min(watchdog_collection_interval_seconds * 3, 60), 300))'
        eval_time: 60s
        exp_samples:
          - labels: '{agency_id="A",agency_name="Agency A",feed="0",vehicle_id="va1",server_name="s1",server_url="http://s1"}'
            value: 10
          - labels: '{agency_id="B",agency_name="Agency B",feed="0",vehicle_id="vb1",server_name="s2",server_url="http://s2"}'
            value: 20
      # 120s: the feed failed with a recent last success and collection.
      - expr: *unexpected_zero
        eval_time: 120s
        exp_samples: []
      - expr: *unattributed
        eval_time: 120s
        exp_samples: []
      - expr: *unattributed_reason
        eval_time: 120s
        exp_samples: []
      - expr: *potential_agency
        eval_time: 120s
        exp_samples: []
      - expr: *speed_age
        eval_time: 120s
        exp_samples: []
      # 180s: feed success is set, but its last success is stale.
      - expr: *unexpected_zero
        eval_time: 180s
        exp_samples: []
      - expr: *unattributed
        eval_time: 180s
        exp_samples: []
      - expr: *unattributed_reason
        eval_time: 180s
        exp_samples: []
      - expr: *potential_agency
        eval_time: 180s
        exp_samples: []
      - expr: *speed_age
        eval_time: 180s
        exp_samples: []
      # 240s: the feed is fresh, but the collection heartbeat is stale.
      - expr: *unexpected_zero
        eval_time: 240s
        exp_samples: []
      - expr: *unattributed
        eval_time: 240s
        exp_samples: []
      - expr: *unattributed_reason
        eval_time: 240s
        exp_samples: []
      - expr: *potential_agency
        eval_time: 240s
        exp_samples: []
      - expr: *speed_age
        eval_time: 240s
        exp_samples: []
